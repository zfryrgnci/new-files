<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Loan Calculator — EMI & Mortgage</title>
<style>
  :root{ --bg:#0b1020; --card:#141a2e; --card2:#1c2440; --line:#293255; --text:#eef2fb; --muted:#93a0c4;
         --p:#4c7bff; --i:#ff8a3d; --radius:16px; }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;}
  html,body{height:100%;} body{background:var(--bg);color:var(--text);}
  #app{max-width:560px;margin:0 auto;min-height:100%;padding:env(safe-area-inset-top) 14px 90px;}
  header{display:flex;align-items:center;justify-content:space-between;padding:14px 4px 8px;}
  .brand{font-size:20px;font-weight:800;} .brand b{color:var(--p);}
  .icon-btn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--text);font-size:18px;cursor:pointer;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px;}
  .result .emi{font-size:38px;font-weight:800;color:var(--p);}
  .result .emi-l{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;}
  .totals{display:flex;gap:10px;margin-top:14px;}
  .totals div{flex:1;background:var(--card2);border-radius:12px;padding:10px 12px;}
  .totals .k{font-size:11px;color:var(--muted);} .totals .v{font-size:16px;font-weight:800;margin-top:2px;}
  .split{height:14px;border-radius:8px;overflow:hidden;display:flex;margin-top:14px;background:var(--card2);}
  .split .pp{background:var(--p);} .split .ii{background:var(--i);}
  .legend{display:flex;gap:16px;margin-top:8px;font-size:12px;color:var(--muted);}
  .legend b{color:var(--text);} .dotp{display:inline-block;width:9px;height:9px;border-radius:3px;background:var(--p);margin-right:5px;}
  .doti{display:inline-block;width:9px;height:9px;border-radius:3px;background:var(--i);margin-right:5px;}
  .field-l{font-size:13px;color:var(--muted);margin:2px 2px 6px;display:flex;justify-content:space-between;}
  .field-l b{color:var(--text);font-size:15px;}
  .row{display:flex;gap:10px;align-items:center;margin-bottom:16px;}
  input[type=number]{background:var(--card2);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:12px;font-size:16px;font-weight:700;width:120px;text-align:right;}
  input[type=range]{-webkit-appearance:none;flex:1;height:6px;border-radius:4px;background:var(--card2);outline:none;}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:var(--p);cursor:pointer;box-shadow:0 0 0 4px rgba(76,123,255,.2);}
  .seg{display:flex;background:var(--card2);border-radius:10px;padding:4px;width:150px;}
  .seg button{flex:1;padding:8px;border:none;background:transparent;color:var(--muted);font-weight:800;border-radius:7px;cursor:pointer;font-size:13px;}
  .seg button.on{background:var(--card);color:var(--text);}
  .btn{width:100%;padding:14px;border:none;border-radius:14px;font-size:15px;font-weight:800;cursor:pointer;background:var(--p);color:#fff;margin-top:4px;}
  .sched{margin-top:6px;}
  .sched table{width:100%;border-collapse:collapse;font-size:13px;}
  .sched th{color:var(--muted);font-weight:600;text-align:right;padding:8px 6px;border-bottom:1px solid var(--line);}
  .sched th:first-child,.sched td:first-child{text-align:left;}
  .sched td{padding:8px 6px;border-bottom:1px solid var(--line);}
  .sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-end;justify-content:center;z-index:60;}
  .sheet-bg.open{display:flex;}
  .sheet{width:100%;max-width:560px;background:var(--card);border-radius:22px 22px 0 0;padding:18px 16px calc(22px + env(safe-area-inset-bottom));max-height:86vh;overflow:auto;}
  .toast{position:fixed;left:50%;bottom:120px;transform:translateX(-50%);background:#000;color:#fff;padding:10px 16px;border-radius:20px;font-size:14px;z-index:80;opacity:0;transition:opacity .3s;pointer-events:none;}
  .toast.show{opacity:.95;}
  .cur{width:66px;text-align:center;}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand">🏦 <b>Loan</b> Calculator</div>
    <button class="icon-btn" id="shareBtn">↗</button>
  </header>

  <div class="card result">
    <div class="emi-l">Monthly payment</div>
    <div class="emi" id="emi">0</div>
    <div class="totals">
      <div><div class="k">Total interest</div><div class="v" id="totInt">0</div></div>
      <div><div class="k">Total paid</div><div class="v" id="totPay">0</div></div>
    </div>
    <div class="split"><div class="pp" id="sp" style="width:70%"></div><div class="ii" id="si" style="width:30%"></div></div>
    <div class="legend"><span><span class="dotp"></span>Principal <b id="pPct">0%</b></span><span><span class="doti"></span>Interest <b id="iPct">0%</b></span></div>
  </div>

  <div class="card">
    <div class="field-l"><span>Loan amount</span><input type="number" id="amtN" class="cur" value="$" style="border:none;background:transparent;width:auto;padding:0;text-align:left;color:var(--muted);" readonly></div>
    <div class="row"><input type="range" id="amtR" min="1000" max="1000000" step="1000" value="200000"><input type="number" id="amtV" value="200000"></div>

    <div class="field-l"><span>Interest rate (annual %)</span></div>
    <div class="row"><input type="range" id="rateR" min="0" max="30" step="0.1" value="7.5"><input type="number" id="rateV" value="7.5" step="0.1"></div>

    <div class="field-l"><span>Term</span></div>
    <div class="row">
      <input type="range" id="termR" min="1" max="360" step="1" value="240">
      <input type="number" id="termV" value="20">
      <div class="seg"><button id="segYear" class="on">Years</button><button id="segMonth">Months</button></div>
    </div>

    <div class="field-l" style="margin-top:6px;"><span>Currency</span></div>
    <div class="row"><input type="text" id="curV" class="cur" value="$" maxlength="3"></div>
    <button class="btn" id="schedBtn">View full payment schedule</button>
  </div>
</div>

<div class="sheet-bg" id="schedSheet"><div class="sheet">
  <h2 style="margin-bottom:10px;">Yearly schedule</h2>
  <div class="sched" id="schedBody"></div>
  <button class="btn" id="closeSched" style="background:transparent;color:var(--muted);border:1px solid var(--line);margin-top:12px;">Close</button>
</div></div>

<div class="toast" id="toast"></div>
<script>
(function(){
  'use strict';
  var termUnit='years'; var openCount=0;
  var cur=localStorage.getItem('loan_cur')||guessCur();
  function guessCur(){ try{ var s=(1).toLocaleString(undefined,{style:'currency',currency:(Intl.NumberFormat().resolvedOptions().currency||'USD')}).replace(/[\d.,\s]/g,''); return s||'$'; }catch(e){ return '$'; } }
  document.getElementById('curV').value=cur;

  function el(id){ return document.getElementById(id); }
  function fmt(n){ if(!isFinite(n)) n=0; return cur+Math.round(n).toLocaleString(); }

  function months(){ var t=parseFloat(el('termV').value)||0; return termUnit==='years'? Math.round(t*12) : Math.round(t); }
  function calc(){
    var P=parseFloat(el('amtV').value)||0;
    var annual=parseFloat(el('rateV').value)||0;
    var n=months(); if(n<1) n=1;
    var r=annual/12/100;
    var emi = r===0 ? P/n : P*r*Math.pow(1+r,n)/(Math.pow(1+r,n)-1);
    var total=emi*n; var interest=total-P;
    el('emi').textContent=fmt(emi);
    el('totInt').textContent=fmt(interest);
    el('totPay').textContent=fmt(total);
    var pPct = total>0 ? Math.round(P/total*100) : 100;
    el('sp').style.width=pPct+'%'; el('si').style.width=(100-pPct)+'%';
    el('pPct').textContent=pPct+'%'; el('iPct').textContent=(100-pPct)+'%';
    return {P:P,r:r,n:n,emi:emi,total:total,interest:interest};
  }

  // sync range <-> number
  function link(rangeId,numId,onChange,transform){
    var R=el(rangeId),N=el(numId);
    R.addEventListener('input',function(){ N.value = transform? transform(R.value):R.value; onChange(); });
    N.addEventListener('input',function(){ var v=parseFloat(N.value); if(!isNaN(v)){ R.value=Math.min(R.max,Math.max(R.min, transform? v*12:v)); } onChange(); });
  }
  el('amtR').addEventListener('input',function(){ el('amtV').value=el('amtR').value; calc(); });
  el('amtV').addEventListener('input',function(){ el('amtR').value=Math.min(1000000,Math.max(1000,parseFloat(el('amtV').value)||0)); calc(); });
  el('rateR').addEventListener('input',function(){ el('rateV').value=el('rateR').value; calc(); });
  el('rateV').addEventListener('input',function(){ el('rateR').value=Math.min(30,Math.max(0,parseFloat(el('rateV').value)||0)); calc(); });
  el('termR').addEventListener('input',function(){ var m=parseInt(el('termR').value); el('termV').value= termUnit==='years'? (m/12).toFixed(m%12?1:0) : m; calc(); });
  el('termV').addEventListener('input',function(){ var v=parseFloat(el('termV').value)||0; var m=termUnit==='years'? v*12 : v; el('termR').value=Math.min(360,Math.max(1,m)); calc(); });
  el('curV').addEventListener('input',function(){ cur=el('curV').value||'$'; localStorage.setItem('loan_cur',cur); calc(); });

  el('segYear').onclick=function(){ termUnit='years'; el('segYear').className='on'; el('segMonth').className=''; el('termV').value=(parseInt(el('termR').value)/12).toFixed(1); calc(); };
  el('segMonth').onclick=function(){ termUnit='months'; el('segMonth').className='on'; el('segYear').className=''; el('termV').value=parseInt(el('termR').value); calc(); };

  el('schedBtn').onclick=function(){
    var d=calc(); var body=el('schedBody');
    var rows='<table><tr><th>Year</th><th>Interest</th><th>Principal</th><th>Balance</th></tr>';
    var bal=d.P, yInt=0,yPrin=0, y=1;
    for(var m=1;m<=d.n;m++){
      var iM = bal*d.r; var pM=d.emi-iM; bal-=pM; if(bal<0) bal=0; yInt+=iM; yPrin+=pM;
      if(m%12===0 || m===d.n){ rows+='<tr><td>'+y+'</td><td>'+fmt(yInt)+'</td><td>'+fmt(yPrin)+'</td><td>'+fmt(bal)+'</td></tr>'; y++; yInt=0; yPrin=0; }
    }
    rows+='</table>'; body.innerHTML=rows;
    el('schedSheet').classList.add('open');
    if(++openCount % 2 === 1 && window.Native) window.Native.showInterstitial();
  };
  el('closeSched').onclick=function(){ el('schedSheet').classList.remove('open'); };
  el('schedSheet').addEventListener('click',function(e){ if(e.target===this) this.classList.remove('open'); });

  el('shareBtn').onclick=function(){
    var d=calc();
    var txt='Monthly payment '+fmt(d.emi)+' on a '+fmt(d.P)+' loan ('+el('rateV').value+'% for '+el('termV').value+' '+termUnit+'). Calculated with Loan Calculator 🏦 ';
    var url='https://play.google.com/store/apps/details?id=com.refaz.loan';
    if(navigator.share) navigator.share({title:'Loan Calculator',text:txt,url:url}).catch(function(){});
    else if(window.Native&&window.Native.share) window.Native.share(txt+url);
    else { var t=el('toast'); t.textContent='Shared'; t.classList.add('show'); setTimeout(function(){t.classList.remove('show');},1500); }
  };

  calc();
})();
</script>
  <script src="native-bridge.js"></script>
</body>
</html>
