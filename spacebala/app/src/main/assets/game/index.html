<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Space Bala</title>
  <style>
    * { -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; }
    html, body { margin: 0; padding: 0; height: 100%; background: #000; overflow: hidden;
      font-family: 'Courier New', Courier, monospace; touch-action: none; }
    #game-wrapper {
      position: absolute; inset: 0; margin: auto;
      width: min(100vw, 75vh); height: min(133.333vw, 100vh);
      max-width: 100vw; max-height: 100vh;
      background: #000; overflow: hidden;
      box-shadow: 0 0 30px rgba(255, 0, 255, 0.5);
      border: 3px solid #f0f;
      box-sizing: border-box;
    }
    canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; image-rendering: pixelated; }
    #ui { position: absolute; top: 10px; left: 12px; color: #f0f; font-size: 18px; font-weight: bold;
      text-shadow: 0 0 6px #f0f; pointer-events: none; z-index: 5; }
    .mobile-controls { position: absolute; bottom: max(18px, env(safe-area-inset-bottom)); width: 100%;
      display: flex; justify-content: space-between; align-items: flex-end; padding: 0 18px;
      box-sizing: border-box; z-index: 10; }
    .dpad { display: grid; grid-template-columns: 64px; grid-template-rows: 64px 64px; gap: 8px; }
    .btn { width: 64px; height: 64px; background: rgba(0,0,0,0.45); border: 2px solid #f0f; color: #f0f;
      font-size: 26px; display: flex; justify-content: center; align-items: center; border-radius: 12px;
      touch-action: none; }
    .btn:active { background: #f0f; color: #000; }
    #btn-fire { width: 84px; height: 84px; border-radius: 50%; font-size: 18px; }
    #ad-overlay { display: none; position: absolute; inset: 0; background: rgba(0,0,0,0.92);
      z-index: 100; flex-direction: column; justify-content: center; align-items: center;
      color: #fff; text-align: center; padding: 20px; box-sizing: border-box; }
    #overlay-title { color: #f0f; margin: 0 0 18px; font-size: 30px; text-shadow: 0 0 10px #f0f; }
    .ov-btn { padding: 12px 22px; margin: 7px; font-size: 18px; font-family: inherit; font-weight: bold;
      background: transparent; color: #0ff; border: 2px solid #0ff; border-radius: 8px; cursor: pointer; }
    .ov-btn:active { background: #0ff; color: #000; }
    #revive-btn { color: #ffcc00; border-color: #ffcc00; }
    #remove-ads-btn { color: #f0f; border-color: #f0f; font-size: 14px; padding: 8px 14px; }
  </style>
</head>
<body>
  <div id="game-wrapper">
    <canvas id="gameCanvas"></canvas>
    <div id="ui">SCORE: <span id="score">0</span></div>
    <div class="mobile-controls">
      <div class="dpad">
        <div class="btn" id="btn-up">&#9650;</div>
        <div class="btn" id="btn-down">&#9660;</div>
      </div>
      <div class="btn" id="btn-fire">FIRE</div>
    </div>
    <div id="ad-overlay">
      <h1 id="overlay-title">GAME OVER</h1>
      <button class="ov-btn" id="restart-btn">PLAY AGAIN</button>
      <button class="ov-btn" id="revive-btn" style="display:none;">WATCH AD TO REVIVE</button>
      <button class="ov-btn" id="remove-ads-btn">REMOVE ADS</button>
    </div>
  </div>
  <script src="core.js"></script>
  <script src="game.js"></script>
</body>
</html>
