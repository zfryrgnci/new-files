name: Build all games

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        game: [spacebala, neonsnake, quantumascent, habittracker, focus, money, loan, flashcards]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ matrix.game }}
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools" || true
      - name: Prepare signing (committed upload key)
        run: |
          cp "$GITHUB_WORKSPACE/upload-keystore.jks" upload-keystore.jks
          cat > keystore.properties <<'PROPS'
          storeFile=../upload-keystore.jks
          storePassword=TA6Rq0Jkp5xRqMV1z2tnSj9N
          keyAlias=upload
          keyPassword=TA6Rq0Jkp5xRqMV1z2tnSj9N
          PROPS
      - name: Build SIGNED release (AAB + APK)
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease assembleRelease --no-daemon --stacktrace
      - name: Upload signed release
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.game }}-RELEASE-signed
          path: |
            ${{ matrix.game }}/app/build/outputs/bundle/release/*.aab
            ${{ matrix.game }}/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
