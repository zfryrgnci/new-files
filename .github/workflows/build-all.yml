name: Build all games

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        game: [spacebala, neonsnake, quantumascent, habittracker, focus, money, loan]
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}
    defaults:
      run:
        working-directory: ${{ matrix.game }}
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools" || true

      # ---- Always: a playable TEST build (no secrets needed) ----
      - name: Build test APK (debug)
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.game }}-TEST-apk
          path: ${{ matrix.game }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # ---- Only after you add secrets: the SIGNED release for Google Play ----
      - name: Restore signing keystore
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > upload-keystore.jks

      - name: Write keystore.properties
        if: env.HAS_KEYSTORE == 'true'
        run: |
          cat > keystore.properties <<PROPS
          storeFile=../upload-keystore.jks
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEYSTORE_PASSWORD }}
          PROPS

      - name: Build signed release (AAB + APK)
        if: env.HAS_KEYSTORE == 'true'
        run: ./gradlew bundleRelease assembleRelease --no-daemon --stacktrace

      - name: Upload signed release
        if: env.HAS_KEYSTORE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.game }}-RELEASE-signed
          path: |
            ${{ matrix.game }}/app/build/outputs/bundle/release/*.aab
            ${{ matrix.game }}/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
