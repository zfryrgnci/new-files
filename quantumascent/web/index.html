<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Quantum Orb: Ascent</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&display=swap');

        :root {
            --bg-color: #050510;
            --theme-primary: #45f3ff;
            --theme-secondary: #b500ff;
            --theme-hazard: #ff2a2a;
            --glass-bg: rgba(5, 5, 16, 0.85);
            --text: #fff;
        }

        * {
            box-sizing: border-box;
            margin: 0; padding: 0;
            user-select: none; -webkit-user-select: none;
            font-family: 'Orbitron', sans-serif;
        }

        body {
            background-color: #000;
            color: var(--text);
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            touch-action: none;
        }

        #game-container {
            width: 100%; max-width: 450px;
            height: 100%; max-height: 900px;
            position: relative;
            background: var(--bg-color);
            box-shadow: 0 0 50px rgba(255, 255, 255, 0.05);
            display: flex; flex-direction: column;
        }

        #canvas-wrapper { flex: 1; position: relative; }
        canvas { display: block; width: 100%; height: 100%; }

        /* UI Overlays */
        #hud {
            position: absolute; top: 0; left: 0; right: 0;
            padding: 15px; display: flex; justify-content: space-between;
            pointer-events: none; z-index: 10;
        }
        .hud-text { font-size: 1.1rem; font-weight: 700; text-shadow: 0 0 5px var(--theme-primary); }
        .hud-level { color: #fff; text-shadow: 0 0 5px #fff; text-align: center; font-size: 1.3rem;}

        .screen {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: var(--glass-bg);
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            display: none; flex-direction: column; justify-content: center; align-items: center;
            z-index: 50; text-align: center; padding: 20px;
        }
        .screen.active { display: flex; }

        .title {
            font-size: 3rem; color: transparent;
            -webkit-text-stroke: 1px #fff;
            text-shadow: 0 0 15px var(--theme-primary), 0 0 30px var(--theme-secondary);
            margin-bottom: 20px; line-height: 1.1;
        }

        .btn {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text); border: 1px solid var(--theme-primary);
            padding: 15px 30px; font-size: 1.1rem; font-weight: 700;
            border-radius: 5px; cursor: pointer; margin: 10px; width: 80%;
            box-shadow: 0 0 15px rgba(255,255,255, 0.1), inset 0 0 10px rgba(255,255,255, 0.05);
            transition: all 0.2s; text-transform: uppercase; letter-spacing: 2px;
        }
        .btn:active { transform: scale(0.95); }
        .btn-ad { border-color: #f1c40f; box-shadow: 0 0 15px rgba(241,196,15,0.3); color: #f1c40f; }

        /* On-Screen Controls */
        #controls {
            position: absolute; bottom: 20px; left: 0; right: 0;
            display: flex; justify-content: space-between; align-items: flex-end;
            padding: 0 20px; z-index: 20; pointer-events: none;
        }
        .d-pad { display: flex; gap: 15px; }
        .ctrl-btn {
            width: 65px; height: 65px;
            background: rgba(255,255,255,0.05);
            border: 2px solid rgba(255,255,255,0.2);
            border-radius: 50%; display: flex; justify-content: center; align-items: center;
            color: rgba(255,255,255,0.5); font-size: 1.5rem; font-weight: bold;
            pointer-events: auto; touch-action: none; cursor: pointer;
        }
        .ctrl-btn:active { background: rgba(255,255,255,0.2); border-color: var(--theme-primary); color: #fff; }
        
        .action-pad { display: flex; flex-direction: column; gap: 15px; align-items: flex-end; }
        #btn-dash { display: none; width: 50px; height: 50px; font-size: 1rem; border-color: var(--theme-secondary); }
        
        #power-toast {
            position: absolute; top: 100px; width: 100%; text-align: center;
            color: #fff; font-size: 1.5rem; text-shadow: 0 0 10px #fff;
            opacity: 0; transition: opacity 0.5s; pointer-events: none; z-index: 30;
        }

    </style>
</head>
<body>

<div id="game-container">
    <div id="hud">
        <div class="hud-text">Cores: <span id="val-cores">0</span>/3</div>
        <div class="hud-level">LVL <span id="val-level">1</span></div>
        <div class="hud-text" style="color:#f1c40f; text-shadow: 0 0 5px #f1c40f;">🪙 <span id="val-coins">0</span></div>
    </div>
    
    <div id="power-toast">POWER UNLOCKED!</div>

    <div id="canvas-wrapper">
        <canvas id="gameCanvas"></canvas>
    </div>

    <div id="controls">
        <div class="d-pad">
            <div class="ctrl-btn" id="btn-left">◄</div>
            <div class="ctrl-btn" id="btn-right">►</div>
        </div>
        <div class="action-pad">
            <div class="ctrl-btn" id="btn-dash">⚡</div>
            <div class="ctrl-btn" id="btn-up" style="width: 75px; height: 75px;">▲</div>
        </div>
    </div>

    <!-- Main Menu -->
    <div id="main-menu" class="screen active">
        <h1 class="title">QUANTUM<br>ASCENT</h1>
        <div style="margin-bottom: 20px; font-size:1.2rem;">Campaign: 12 Levels</div>
        <button class="btn" onclick="startGame()">Start / Continue</button>
        <button class="btn" onclick="resetSave()" style="font-size:0.8rem; padding: 10px; border-color:#555;">Wipe Save</button>
    </div>

    <!-- Interstitial Ad Screen -->
    <div id="ad-screen" class="screen">
        <h1 class="title" style="font-size: 2rem;">COMMERCIAL BREAK</h1>
        <div style="margin-bottom: 30px;">(Simulated Ad Integration)</div>
        <div id="ad-timer" style="font-size: 3rem; margin-bottom: 20px; color: #f1c40f;">3</div>
        <button class="btn" id="btn-skip-ad" style="display:none;" onclick="finishAd()">Skip Ad</button>
    </div>

    <!-- Death Screen -->
    <div id="death-screen" class="screen">
        <h1 class="title" style="-webkit-text-stroke: 1px var(--theme-hazard); text-shadow: 0 0 20px var(--theme-hazard);">SIGNAL LOST</h1>
        <button class="btn btn-ad" id="btn-revive" onclick="watchAdToRevive()">Watch Ad: Restore</button>
        <button class="btn" onclick="restartLevel()">Restart Level</button>
        <button class="btn" onclick="returnToMenu()">Menu</button>
    </div>
    
    <!-- Level Complete Screen -->
    <div id="win-screen" class="screen">
        <h1 class="title" style="-webkit-text-stroke: 1px #fff; text-shadow: 0 0 20px #fff;">PORTAL OPENED</h1>
        <div style="font-size: 1.5rem; margin-bottom: 20px;">Level <span id="win-lvl-num">1</span> Cleared</div>
        <div id="win-power-msg" style="color:var(--theme-secondary); margin-bottom:20px; font-weight:bold; display:none;">New Power Unlocked!</div>
        <button class="btn" onclick="nextLevel()">Proceed</button>
    </div>
    
    <!-- Game Complete -->
    <div id="end-screen" class="screen">
        <h1 class="title" style="-webkit-text-stroke: 1px #f1c40f; text-shadow: 0 0 20px #f1c40f;">ASCENSION<br>COMPLETE</h1>
        <div style="font-size: 1.2rem; margin-bottom: 30px;">You have conquered all 12 levels!</div>
        <button class="btn" onclick="returnToMenu()">Menu</button>
    </div>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d', {alpha: false});
    
    function resize() {
        canvas.width = canvas.parentElement.clientWidth;
        canvas.height = canvas.parentElement.clientHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // --- SAVE STATE ---
    let state = { level: 1, coins: 0, hasDoubleJump: false, hasDash: false };
    function loadSave() {
        const saved = localStorage.getItem('quantum_v2_save');
        if(saved) state = JSON.parse(saved);
        updateUIState();
    }
    function saveGame() { localStorage.setItem('quantum_v2_save', JSON.stringify(state)); }
    function resetSave() { localStorage.removeItem('quantum_v2_save'); location.reload(); }

    function updateUIState() {
        document.getElementById('val-level').innerText = state.level;
        document.getElementById('val-coins').innerText = state.coins;
        document.getElementById('btn-dash').style.display = state.hasDash ? 'flex' : 'none';
        applyTheme(state.level);
    }

    // --- THEMES ---
    function applyTheme(lvl) {
        let root = document.documentElement;
        if(lvl <= 4) { // The Grid
            root.style.setProperty('--bg-color', '#050510');
            root.style.setProperty('--theme-primary', '#45f3ff');
            root.style.setProperty('--theme-secondary', '#b500ff');
            root.style.setProperty('--theme-hazard', '#ff2a2a');
        } else if (lvl <= 8) { // The Core
            root.style.setProperty('--bg-color', '#1a0505');
            root.style.setProperty('--theme-primary', '#ff7b00');
            root.style.setProperty('--theme-secondary', '#ffea00');
            root.style.setProperty('--theme-hazard', '#ff0000');
        } else { // The Void
            root.style.setProperty('--bg-color', '#000000');
            root.style.setProperty('--theme-primary', '#ffffff');
            root.style.setProperty('--theme-secondary', '#333333');
            root.style.setProperty('--theme-hazard', '#00ff66'); // Glitch green
        }
    }

    // --- PHYSICS CONSTANTS (Highly Polished for Vertical) ---
    const GRAVITY = 1000; // Floatier, more forgiving gravity
    const FRICTION = 0.99;
    const GROUND_FRICTION = 0.85; 
    const MOVE_FORCE = 2000; // Smoother horizontal acceleration
    const MAX_SPEED = 450; // Easier to control mid-air
    const JUMP_FORCE = -750; // Beautiful floaty jump arc
    const RESTITUTION = 0.5; // Natural bounce

    // --- INPUT ---
    const keys = { left: false, right: false, up: false, dash: false };
    let justPressedUp = false;
    let justPressedDash = false;
    
    window.addEventListener('keydown', (e) => {
        if(e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = true;
        if(e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = true;
        if(e.code === 'ArrowUp' || e.code === 'KeyW' || e.code === 'Space') { if(!keys.up) justPressedUp = true; keys.up = true; }
        if(e.code === 'ShiftLeft' || e.code === 'KeyE') { if(!keys.dash) justPressedDash = true; keys.dash = true; }
    });
    window.addEventListener('keyup', (e) => {
        if(e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = false;
        if(e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = false;
        if(e.code === 'ArrowUp' || e.code === 'KeyW' || e.code === 'Space') keys.up = false;
        if(e.code === 'ShiftLeft' || e.code === 'KeyE') keys.dash = false;
    });

    // Touch
    function setupTouch(id, key, justPressedKey) {
        const el = document.getElementById(id);
        if(!el) return;
        el.addEventListener('touchstart', (e) => { e.preventDefault(); if(justPressedKey && !keys[key]) window[justPressedKey] = true; keys[key] = true; });
        el.addEventListener('touchend', (e) => { e.preventDefault(); keys[key] = false; });
    }
    setupTouch('btn-left', 'left');
    setupTouch('btn-right', 'right');
    setupTouch('btn-up', 'up', 'justPressedUp');
    setupTouch('btn-dash', 'dash', 'justPressedDash');

    // --- ENTITIES ---
    let orb = { x: 0, y: 0, vx: 0, vy: 0, radius: 12, isGrounded: false, jumps: 0, dashTimer: 0 };
    let camera = { x: 0, y: 0 };
    let platforms = [], hazards = [], collectibles = [], particles = [];
    let checkpoint = { x: 0, y: 0 };
    let coresCollected = 0;
    let isPlaying = false;
    let lastTime = 0;
    let levelEndRadius = 0;

    // --- LEVEL GENERATOR ---
    // Generates a vertical level. The higher the level, the taller and harder it is.
    function generateLevel(lvlNum) {
        platforms = []; hazards = []; collectibles = []; particles = [];
        
        let startY = 800; // Bottom of canvas area
        let levelHeight = 800 + (lvlNum * 250); // Much shorter, less exhausting levels
        let endY = startY - levelHeight;
        
        // Floor and walls
        let w = canvas.width;
        platforms.push({x: -50, y: startY, w: w + 100, h: 100}); // floor
        platforms.push({x: -50, y: endY - 200, w: 50, h: levelHeight + 300}); // left wall
        platforms.push({x: w, y: endY - 200, w: 50, h: levelHeight + 300}); // right wall

        // Procedural vertical steps
        let currentY = startY - 150;
        let pWidth = 180; // Extremely wide platforms for playful jumping
        if(lvlNum > 6) pWidth = 160;
        if(lvlNum > 10) pWidth = 140;

        let lastX = w / 2;
        let coresPlaced = 0;
        let coreYTargets = [startY - (levelHeight*0.3), startY - (levelHeight*0.6), startY - (levelHeight*0.9)];

        // Seeded random for consistency
        let seed = lvlNum * 1337;
        function random() {
            let x = Math.sin(seed++) * 10000;
            return x - Math.floor(x);
        }

        while(currentY > endY) {
            // Gap between platforms vertically
            let gapY = 80 + random() * 30; // Very close together vertically!
            if(state.hasDoubleJump) gapY += 20;
            currentY -= gapY;

            let px = random() * (w - pWidth - 40) + 20;
            
            // Ensure reachable horizontally (very logical, easy stepping stones)
            if(Math.abs(px - lastX) > 80 && !state.hasDash) {
                px = lastX + (px > lastX ? 80 : -80); 
            }

            platforms.push({x: px, y: currentY, w: pWidth, h: 20});

            // Add hazard sometimes (Starts later, less frequent)
            if(lvlNum >= 3 && random() > 0.85) {
                let hx = random() > 0.5 ? px : px + pWidth - 30;
                hazards.push({x: hx, y: currentY - 10, w: 30, h: 10});
            }

            // Place cores
            if(coresPlaced < 3 && currentY < coreYTargets[coresPlaced]) {
                collectibles.push({x: px + pWidth/2, y: currentY - 30, type: 'core', collected: false});
                coresPlaced++;
            } else if (random() > 0.8) {
                // Place coin
                collectibles.push({x: px + pWidth/2, y: currentY - 30, type: 'coin', collected: false});
            }

            lastX = px;
        }

        // Exit Portal Platform at the very top
        platforms.push({x: w/2 - 100, y: endY, w: 200, h: 20});

        checkpoint = { x: w/2, y: startY - 20 };
        orb.x = checkpoint.x;
        orb.y = checkpoint.y;
        orb.vx = 0; orb.vy = 0;
        orb.dashTimer = 0;
        coresCollected = 0;
        levelEndRadius = 0;
        
        camera.x = 0;
        camera.y = startY - canvas.height/2;
    }

    // --- GAME LOOP ---
    function startGame() {
        document.getElementById('main-menu').classList.remove('active');
        loadSave();
        generateLevel(state.level);
        updateHUD();
        isPlaying = true;
        lastTime = performance.now();
        requestAnimationFrame(loop);
    }

    function loop(timestamp) {
        if(!isPlaying) return;
        let dt = (timestamp - lastTime) / 1000;
        if(dt > 0.1) dt = 0.1;
        lastTime = timestamp;

        update(dt);
        render();
        
        justPressedUp = false;
        justPressedDash = false;
        
        requestAnimationFrame(loop);
    }

    function update(dt) {
        // --- INPUT & PHYSICS ---
        let canMove = orb.dashTimer <= 0;
        
        if(canMove) {
            if(keys.left) orb.vx -= MOVE_FORCE * dt;
            if(keys.right) orb.vx += MOVE_FORCE * dt;
        }
        
        // Jump & Double Jump
        if(justPressedUp) {
            if(orb.isGrounded) {
                orb.vy = JUMP_FORCE;
                orb.isGrounded = false;
                orb.jumps = 1;
                createParticles(orb.x, orb.y + orb.radius, 10, '#fff');
            } else if (state.hasDoubleJump && orb.jumps === 1) {
                orb.vy = JUMP_FORCE * 0.9;
                orb.jumps = 2;
                createParticles(orb.x, orb.y, 15, varColor('--theme-secondary'));
            }
        }

        // Dash
        if(justPressedDash && state.hasDash && orb.dashTimer <= 0 && !orb.isGrounded) {
            orb.dashTimer = 0.3; // 300ms dash
            orb.vy = 0; // suspend gravity
            orb.vx = keys.left ? -MAX_SPEED * 1.5 : (keys.right ? MAX_SPEED * 1.5 : orb.vx);
            if(orb.vx === 0) orb.vx = MAX_SPEED * 1.5; // default right
            createParticles(orb.x, orb.y, 20, varColor('--theme-primary'));
        }

        if(orb.dashTimer > 0) {
            orb.dashTimer -= dt;
            orb.vy = 0; // No gravity during dash
            if(Math.random() > 0.5) createParticles(orb.x, orb.y, 1, varColor('--theme-primary')); // trail
        } else {
            orb.vy += GRAVITY * dt; // Gravity
        }
        
        // Friction & Limits
        if(orb.isGrounded) {
            orb.vx *= GROUND_FRICTION;
            orb.jumps = 0;
        } else if (orb.dashTimer <= 0) {
            orb.vx *= FRICTION;
        }
        
        if(orb.dashTimer <= 0) {
            if(orb.vx > MAX_SPEED) orb.vx = MAX_SPEED;
            if(orb.vx < -MAX_SPEED) orb.vx = -MAX_SPEED;
        }

        let nextX = orb.x + orb.vx * dt;
        let nextY = orb.y + orb.vy * dt;

        // --- COLLISION DETECTION ---
        orb.isGrounded = false;
        
        for(let p of platforms) {
            let closestX = Math.max(p.x, Math.min(nextX, p.x + p.w));
            let closestY = Math.max(p.y, Math.min(nextY, p.y + p.h));
            let dx = nextX - closestX;
            let dy = nextY - closestY;
            
            if((dx*dx + dy*dy) < (orb.radius * orb.radius)) {
                if(orb.vy > 0 && orb.y < p.y + 10) {
                    nextY = p.y - orb.radius;
                    if(orb.vy > 200) orb.vy = -orb.vy * RESTITUTION;
                    else { orb.vy = 0; orb.isGrounded = true; }
                } 
                else if(orb.vy < 0 && orb.y > p.y + p.h - 10) {
                    nextY = p.y + p.h + orb.radius;
                    orb.vy = -orb.vy * RESTITUTION;
                }
                else if(orb.vx > 0 && orb.x < p.x + 10) {
                    nextX = p.x - orb.radius;
                    orb.vx = -orb.vx * RESTITUTION;
                    orb.dashTimer = 0; // kill dash on wall hit
                }
                else if(orb.vx < 0 && orb.x > p.x + p.w - 10) {
                    nextX = p.x + p.w + orb.radius;
                    orb.vx = -orb.vx * RESTITUTION;
                    orb.dashTimer = 0;
                }
            }
        }

        orb.x = nextX;
        orb.y = nextY;

        // Hazards
        for(let h of hazards) {
            if(orb.x + orb.radius > h.x && orb.x - orb.radius < h.x + h.w &&
               orb.y + orb.radius > h.y && orb.y - orb.radius < h.y + h.h) {
                die(); return;
            }
        }
        
        // Death by falling off camera
        if(orb.y > camera.y + canvas.height + 100) { die(); return; }

        // Collectibles
        for(let c of collectibles) {
            if(!c.collected) {
                let dx = orb.x - c.x; let dy = orb.y - c.y;
                if(dx*dx + dy*dy < 400) {
                    c.collected = true;
                    if(c.type === 'core') {
                        coresCollected++;
                        createParticles(c.x, c.y, 20, varColor('--theme-primary'));
                        checkpoint = { x: c.x, y: c.y - 30 }; // Save checkpoint
                    } else if (c.type === 'coin') {
                        state.coins++;
                        createParticles(c.x, c.y, 10, '#f1c40f');
                    }
                    updateHUD();
                }
            }
        }

        // Win Condition (Reach top platform with all cores)
        let topPlatform = platforms[platforms.length-1];
        if(coresCollected >= 3 && orb.y < topPlatform.y && orb.x > topPlatform.x && orb.x < topPlatform.x + topPlatform.w) {
            levelComplete();
        }

        // Camera Follow (Smooth Vertical)
        let targetCamY = orb.y - canvas.height * 0.6; // Keep orb lower on screen to see upwards
        camera.y += (targetCamY - camera.y) * 8 * dt;

        // Update Particles
        for(let i=particles.length-1; i>=0; i--) {
            let p = particles[i];
            p.x += p.vx * dt; p.y += p.vy * dt;
            p.life -= dt;
            if(p.life <= 0) particles.splice(i, 1);
        }
        
        // Portal logic
        if(coresCollected >= 3) { levelEndRadius = Math.min(50, levelEndRadius + 100*dt); }
    }

    function die() {
        isPlaying = false;
        createParticles(orb.x, orb.y, 30, varColor('--theme-hazard'));
        render(); 
        setTimeout(() => { document.getElementById('death-screen').classList.add('active'); }, 500);
    }

    function restartLevel() {
        document.getElementById('death-screen').classList.remove('active');
        generateLevel(state.level);
        isPlaying = true;
        lastTime = performance.now();
        requestAnimationFrame(loop);
    }

    function watchAdToRevive() {
        document.getElementById('btn-revive').innerText = "Connecting...";
        setTimeout(() => {
            document.getElementById('death-screen').classList.remove('active');
            document.getElementById('btn-revive').innerText = "Watch Ad: Restore";
            orb.x = checkpoint.x; orb.y = checkpoint.y;
            orb.vx = 0; orb.vy = 0;
            camera.y = orb.y - canvas.height/2;
            isPlaying = true; lastTime = performance.now();
            requestAnimationFrame(loop);
        }, 1000);
    }

    function levelComplete() {
        isPlaying = false;
        saveGame();
        
        let msg = document.getElementById('win-power-msg');
        msg.style.display = 'none';
        
        if(state.level === 4 && !state.hasDoubleJump) {
            state.hasDoubleJump = true; saveGame();
            msg.innerText = "POWER UNLOCKED: DOUBLE JUMP!"; msg.style.display = 'block';
        }
        if(state.level === 8 && !state.hasDash) {
            state.hasDash = true; saveGame();
            msg.innerText = "POWER UNLOCKED: QUANTUM DASH!"; msg.style.display = 'block';
        }

        document.getElementById('win-lvl-num').innerText = state.level;
        setTimeout(() => { document.getElementById('win-screen').classList.add('active'); }, 500);
    }

    function nextLevel() {
        document.getElementById('win-screen').classList.remove('active');
        if(state.level >= 12) {
            document.getElementById('end-screen').classList.add('active');
            return;
        }
        
        state.level++;
        saveGame();
        updateUIState();
        
        // Simulate Interstitial Ad every 2 levels
        if(state.level % 2 === 1) {
            showAdScreen();
        } else {
            generateLevel(state.level);
            isPlaying = true; lastTime = performance.now();
            requestAnimationFrame(loop);
        }
    }

    // --- ADS ---
    function showAdScreen() {
        document.getElementById('ad-screen').classList.add('active');
        let timer = 3;
        let timerEl = document.getElementById('ad-timer');
        let skipBtn = document.getElementById('btn-skip-ad');
        timerEl.innerText = timer;
        skipBtn.style.display = 'none';
        
        let intv = setInterval(() => {
            timer--;
            timerEl.innerText = timer;
            if(timer <= 0) {
                clearInterval(intv);
                timerEl.style.display = 'none';
                skipBtn.style.display = 'block';
            }
        }, 1000);
    }

    function finishAd() {
        document.getElementById('ad-screen').classList.remove('active');
        document.getElementById('ad-timer').style.display = 'block'; // reset
        generateLevel(state.level);
        isPlaying = true; lastTime = performance.now();
        requestAnimationFrame(loop);
    }

    function returnToMenu() {
        document.getElementById('death-screen').classList.remove('active');
        document.getElementById('end-screen').classList.remove('active');
        document.getElementById('main-menu').classList.add('active');
    }

    // --- VISUALS ---
    function varColor(name) { return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }

    function createParticles(x, y, count, color) {
        for(let i=0; i<count; i++) {
            let angle = Math.random() * Math.PI*2;
            let speed = Math.random() * 200 + 50;
            particles.push({
                x: x, y: y,
                vx: Math.cos(angle)*speed, vy: Math.sin(angle)*speed,
                life: Math.random() * 0.5 + 0.2, maxLife: 0.7,
                size: Math.random() * 4 + 1, color: color
            });
        }
    }

    function render() {
        ctx.fillStyle = varColor('--bg-color');
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.save();
        ctx.translate(0, -camera.y); // Vertical translation only (horizontal fixed)

        // Parallax Grid Background
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.05)';
        ctx.lineWidth = 1;
        let startY = Math.floor(camera.y / 50) * 50;
        for(let x = 0; x < canvas.width; x += 50) {
            ctx.beginPath(); ctx.moveTo(x, camera.y); ctx.lineTo(x, camera.y + canvas.height); ctx.stroke();
        }
        for(let y = startY; y < startY + canvas.height + 50; y += 50) {
            ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
        }

        let pColor = varColor('--theme-primary');
        let hColor = varColor('--theme-hazard');
        
        // Platforms
        ctx.shadowBlur = 10; ctx.shadowColor = pColor;
        ctx.strokeStyle = pColor; ctx.fillStyle = 'rgba(255,255,255,0.05)';
        ctx.lineWidth = 2;
        for(let p of platforms) {
            ctx.fillRect(p.x, p.y, p.w, p.h);
            ctx.strokeRect(p.x, p.y, p.w, p.h);
        }

        // Hazards
        ctx.shadowColor = hColor; ctx.strokeStyle = hColor; ctx.fillStyle = 'rgba(255, 42, 42, 0.2)';
        for(let h of hazards) {
            ctx.fillRect(h.x, h.y, h.w, h.h);
            ctx.beginPath(); ctx.moveTo(h.x, h.y + h.h/2);
            for(let lx = h.x; lx < h.x + h.w; lx += 10) ctx.lineTo(lx, h.y + h.h/2 + (Math.random()*10 - 5));
            ctx.stroke();
        }

        // Collectibles
        for(let c of collectibles) {
            if(c.collected) continue;
            ctx.beginPath();
            if(c.type === 'core') {
                ctx.shadowColor = '#fff'; ctx.strokeStyle = '#fff'; ctx.fillStyle = '#fff';
                ctx.arc(c.x, c.y, 8 + Math.sin(Date.now()/200)*2, 0, Math.PI*2);
            } else if(c.type === 'coin') {
                ctx.shadowColor = '#f1c40f'; ctx.strokeStyle = '#f1c40f'; ctx.fillStyle = '#f1c40f';
                ctx.arc(c.x, c.y, 5, 0, Math.PI*2);
            }
            ctx.fill(); ctx.stroke();
        }
        
        // Exit Portal
        if(coresCollected >= 3 && platforms.length > 0) {
            let tp = platforms[platforms.length-1];
            ctx.shadowColor = varColor('--theme-secondary'); ctx.fillStyle = varColor('--theme-secondary');
            ctx.beginPath(); ctx.arc(tp.x + tp.w/2, tp.y - 10, levelEndRadius, 0, Math.PI*2); ctx.fill();
        }

        // Particles
        for(let p of particles) {
            ctx.shadowColor = p.color; ctx.fillStyle = p.color;
            ctx.globalAlpha = Math.max(0, p.life / p.maxLife);
            ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI*2); ctx.fill();
        }
        ctx.globalAlpha = 1.0;

        // Player (Orb)
        ctx.shadowBlur = 20; ctx.shadowColor = pColor;
        
        ctx.save();
        ctx.translate(orb.x, orb.y);
        if(orb.dashTimer > 0) { ctx.scale(1.5, 0.5); } // Squish on dash
        
        ctx.fillStyle = '#fff';
        ctx.beginPath(); ctx.arc(0, 0, orb.radius, 0, Math.PI*2); ctx.fill();
        ctx.restore();

        ctx.restore(); // End Camera
    }

    function updateHUD() {
        document.getElementById('val-cores').innerText = coresCollected;
        document.getElementById('val-coins').innerText = state.coins;
    }

    updateUIState();
</script>
  <script src="native-bridge.js"></script>
  <script src="quantum-adapter.js"></script>
</body>
