<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neon Snake Rush</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&display=swap');

        :root {
            --bg-color: #0b0c10;
            --grid-color: rgba(69, 252, 255, 0.05);
            --neon-blue: #45f3ff;
            --neon-pink: #ff1053;
            --neon-green: #00ff87;
            --glass-bg: rgba(11, 12, 16, 0.7);
            --glass-border: rgba(69, 252, 255, 0.2);
            --text-light: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            font-family: 'Orbitron', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            background-image: 
                linear-gradient(var(--grid-color) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid-color) 1px, transparent 1px);
            background-size: 20px 20px;
            color: var(--text-light);
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            touch-action: none;
        }

        #game-container {
            width: 100%;
            max-width: 500px;
            height: 100%;
            max-height: 900px;
            position: relative;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 50px rgba(0,0,0,0.8);
        }

        /* Top HUD */
        #hud {
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
            background: linear-gradient(to bottom, rgba(11,12,16,1), rgba(11,12,16,0));
        }
        
        .stat-box {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .stat-label { font-size: 0.8rem; color: #888; text-transform: uppercase; letter-spacing: 2px;}
        .stat-value { font-size: 1.8rem; font-weight: 900; color: var(--text-light); text-shadow: 0 0 10px var(--neon-blue); }
        #val-coins { color: #f1c40f; text-shadow: 0 0 10px #f1c40f; }

        /* Canvas Wrapper */
        #canvas-wrapper {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
            position: relative;
        }

        canvas {
            background: rgba(0,0,0,0.4);
            border: 2px solid var(--glass-border);
            border-radius: 10px;
            box-shadow: inset 0 0 30px rgba(69, 252, 255, 0.1), 0 0 20px rgba(0,0,0,0.5);
            max-width: 100%;
            max-height: 100%;
        }

        /* Glassmorphism Screens */
        .screen {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 50;
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 30px;
            text-align: center;
        }
        .screen.active { display: flex; }

        .title-glow {
            font-size: 3.5rem;
            font-weight: 900;
            color: transparent;
            -webkit-text-stroke: 2px var(--neon-blue);
            text-shadow: 0 0 20px var(--neon-blue), 0 0 40px var(--neon-pink);
            margin-bottom: 40px;
            line-height: 1.1;
        }

        /* Buttons */
        .btn {
            background: transparent;
            color: var(--neon-blue);
            border: 2px solid var(--neon-blue);
            padding: 15px 40px;
            font-size: 1.2rem;
            font-weight: 700;
            border-radius: 30px;
            cursor: pointer;
            margin: 10px;
            box-shadow: 0 0 15px rgba(69, 252, 255, 0.3), inset 0 0 10px rgba(69, 252, 255, 0.2);
            transition: all 0.2s;
            text-transform: uppercase;
            letter-spacing: 2px;
            width: 80%;
            max-width: 300px;
        }
        .btn:active { transform: scale(0.95); }
        .btn-play { background: var(--neon-blue); color: #000; box-shadow: 0 0 20px var(--neon-blue); }
        .btn-ad { background: var(--neon-green); color: #000; border-color: var(--neon-green); box-shadow: 0 0 20px var(--neon-green); }
        
        /* Shop */
        .shop-panel {
            background: rgba(0,0,0,0.6);
            border: 1px solid var(--glass-border);
            border-radius: 15px;
            padding: 20px;
            width: 100%;
            margin-top: 20px;
        }
        .shop-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 15px;
        }
        .shop-item:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
        
        .upgrade-btn {
            background: #f1c40f; color: #000; border: none; padding: 10px 20px; border-radius: 20px; font-weight: 800; cursor: pointer;
            box-shadow: 0 0 10px rgba(241, 196, 15, 0.5);
        }
        .upgrade-btn.disabled { background: #555; color: #888; box-shadow: none; pointer-events: none; }

        #swipe-hint {
            position: absolute;
            bottom: 30px;
            width: 100%;
            text-align: center;
            color: rgba(255,255,255,0.5);
            font-size: 1rem;
            animation: pulseHint 2s infinite;
            pointer-events: none;
        }
        @keyframes pulseHint {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 0.8; }
        }
    </style>
</head>
<body>

<div id="game-container">
    
    <!-- HUD -->
    <div id="hud">
        <div class="stat-box">
            <span class="stat-label">Score</span>
            <span class="stat-value" id="val-score">0</span>
        </div>
        <div class="stat-box">
            <span class="stat-label">Coins</span>
            <span class="stat-value" id="val-coins">0</span>
        </div>
    </div>

    <!-- Gameplay Canvas -->
    <div id="canvas-wrapper">
        <canvas id="gameCanvas" width="400" height="400"></canvas>
        <div id="swipe-hint">Swipe to Move</div>
    </div>

    <!-- Main Menu Screen -->
    <div id="main-menu" class="screen active">
        <h1 class="title-glow">NEON<br>SNAKE</h1>
        <button class="btn btn-play" onclick="startGame()">Play Game</button>
        
        <div class="shop-panel">
            <h2 style="margin-bottom: 15px; color: #f1c40f;">Upgrades</h2>
            <div class="shop-item">
                <div style="text-align: left;">
                    <div style="font-size:1.1rem; font-weight:700;">Start Length <span id="lvl-len">(Lvl 1)</span></div>
                    <div style="font-size:0.8rem; color:#aaa;">Begin with a longer snake</div>
                </div>
                <button class="upgrade-btn" id="btn-buy-len" onclick="buyUpgrade('len')">100 🪙</button>
            </div>
            <div class="shop-item">
                <div style="text-align: left;">
                    <div style="font-size:1.1rem; font-weight:700;">Coin Multiplier <span id="lvl-mult">(Lvl 1)</span></div>
                    <div style="font-size:0.8rem; color:#aaa;">Earn more coins per food</div>
                </div>
                <button class="upgrade-btn" id="btn-buy-mult" onclick="buyUpgrade('mult')">250 🪙</button>
            </div>
        </div>
        <button class="btn" style="margin-top:20px; font-size:0.9rem; border-color:#888; color:#888; box-shadow:none;" onclick="clearSave()">Reset Save</button>
    </div>

    <!-- Game Over Screen -->
    <div id="game-over" class="screen">
        <h1 class="title-glow" style="font-size: 3rem; -webkit-text-stroke: 2px var(--neon-pink);">GAME OVER</h1>
        <div style="font-size: 1.5rem; margin-bottom: 10px;">Score: <span id="go-score" style="color:var(--neon-blue); font-weight:900;">0</span></div>
        <div style="font-size: 1.2rem; margin-bottom: 40px; color:#f1c40f;">Coins Earned: +<span id="go-coins">0</span></div>
        
        <button class="btn btn-ad" id="btn-revive" onclick="watchAdToRevive()">Watch Ad to Revive (1x)</button>
        <button class="btn" onclick="returnToMenu()">Main Menu</button>
    </div>

</div>

<script>
    // --- ENGINE SETUP ---
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d', { alpha: false }); // optimize
    
    // Grid settings
    const TILE_SIZE = 20;
    const TILES_X = 20; // 400/20
    const TILES_Y = 20;

    // Game State
    let state = {
        coins: 0,
        upgrades: {
            lenLevel: 1,
            multLevel: 1
        }
    };
    
    let snake = [];
    let food = {x: 0, y: 0, type: 'normal'}; // type: normal (pink) or coin (yellow)
    let dx = 1;
    let dy = 0;
    let nextDx = 1;
    let nextDy = 0;
    let score = 0;
    let sessionCoins = 0;
    
    let gameLoop;
    let isPlaying = false;
    let canRevive = true;
    let speed = 120; // ms per frame
    let lastRender = 0;
    
    // Visuals
    let particles = [];

    // --- PERSISTENCE ---
    function loadSave() {
        const saved = localStorage.getItem('neon_snake_save');
        if(saved) state = JSON.parse(saved);
        updateShopUI();
        document.getElementById('val-coins').innerText = state.coins;
    }
    function saveGame() {
        localStorage.setItem('neon_snake_save', JSON.stringify(state));
    }
    function clearSave() {
        localStorage.removeItem('neon_snake_save');
        location.reload();
    }

    // --- INIT & START ---
    function startGame() {
        document.getElementById('main-menu').classList.remove('active');
        document.getElementById('game-over').classList.remove('active');
        document.getElementById('swipe-hint').style.display = 'none';
        
        // Setup initial snake based on upgrades
        let startLen = 2 + state.upgrades.lenLevel;
        snake = [];
        for(let i=0; i<startLen; i++) {
            snake.push({x: Math.floor(TILES_X/2) - i, y: Math.floor(TILES_Y/2)});
        }
        
        dx = 1; dy = 0;
        nextDx = 1; nextDy = 0;
        score = 0;
        sessionCoins = 0;
        canRevive = true;
        speed = 130;
        particles = [];
        
        updateHUD();
        spawnFood();
        
        isPlaying = true;
        lastRender = performance.now();
        requestAnimationFrame(loop);
    }

    // --- MAIN LOOP ---
    function loop(timestamp) {
        if(!isPlaying) return;
        requestAnimationFrame(loop);
        
        const delta = timestamp - lastRender;
        
        // Render particles at 60fps regardless of snake speed
        render(delta);
        
        // Update snake logic based on speed (step-based)
        if (delta > speed) {
            updateSnake();
            lastRender = timestamp;
        }
    }

    function updateSnake() {
        // Apply pending direction
        dx = nextDx;
        dy = nextDy;

        // Calculate new head
        const head = { x: snake[0].x + dx, y: snake[0].y + dy };

        // Collision Check: Walls
        if (head.x < 0 || head.x >= TILES_X || head.y < 0 || head.y >= TILES_Y) {
            gameOver();
            return;
        }

        // Collision Check: Self
        for (let i = 0; i < snake.length; i++) {
            if (head.x === snake[i].x && head.y === snake[i].y) {
                gameOver();
                return;
            }
        }

        // Move Snake
        snake.unshift(head);

        // Check Food
        if (head.x === food.x && head.y === food.y) {
            eatFood();
        } else {
            snake.pop(); // Remove tail if no food eaten
        }
    }

    function eatFood() {
        score += 10;
        
        // Earn coins based on upgrade multiplier
        let earned = 1 * state.upgrades.multLevel;
        if(food.type === 'coin') earned *= 5; // Coin drops are worth 5x
        
        sessionCoins += earned;
        state.coins += earned;
        saveGame();
        
        spawnParticles(food.x * TILE_SIZE + TILE_SIZE/2, food.y * TILE_SIZE + TILE_SIZE/2, food.type === 'coin' ? '#f1c40f' : '#ff1053');
        updateHUD();
        spawnFood();
        
        // Speed up slightly as you grow
        if(speed > 60) speed -= 2; 
    }

    function spawnFood() {
        let valid = false;
        while(!valid) {
            food.x = Math.floor(Math.random() * TILES_X);
            food.y = Math.floor(Math.random() * TILES_Y);
            valid = true;
            for (let part of snake) {
                if (part.x === food.x && part.y === food.y) valid = false;
            }
        }
        // 20% chance for a Coin spawn instead of normal food
        food.type = Math.random() < 0.2 ? 'coin' : 'normal';
    }

    // --- RENDERING ---
    function render(delta) {
        // Clear background
        ctx.fillStyle = '#0b0c10';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Draw Grid
        ctx.strokeStyle = 'rgba(69, 252, 255, 0.05)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        for(let i=0; i<=TILES_X; i++) {
            ctx.moveTo(i*TILE_SIZE, 0); ctx.lineTo(i*TILE_SIZE, canvas.height);
            ctx.moveTo(0, i*TILE_SIZE); ctx.lineTo(canvas.width, i*TILE_SIZE);
        }
        ctx.stroke();

        // Draw Food
        ctx.shadowBlur = 20;
        if(food.type === 'coin') {
            ctx.fillStyle = '#f1c40f';
            ctx.shadowColor = '#f1c40f';
        } else {
            ctx.fillStyle = '#ff1053';
            ctx.shadowColor = '#ff1053';
        }
        // Pulsing effect
        let pulse = Math.sin(performance.now() / 200) * 2;
        ctx.beginPath();
        ctx.arc(food.x * TILE_SIZE + TILE_SIZE/2, food.y * TILE_SIZE + TILE_SIZE/2, (TILE_SIZE/2 - 2) + pulse, 0, Math.PI*2);
        ctx.fill();

        // Draw Snake
        ctx.shadowBlur = 15;
        ctx.shadowColor = '#45f3ff';
        ctx.fillStyle = '#45f3ff';
        
        for (let i = 0; i < snake.length; i++) {
            let part = snake[i];
            // Head is slightly brighter
            if(i === 0) {
                ctx.fillStyle = '#ffffff';
                ctx.shadowBlur = 25;
            } else {
                ctx.fillStyle = '#45f3ff';
                ctx.shadowBlur = 15;
            }
            
            // Draw slightly rounded rects
            ctx.fillRect(part.x * TILE_SIZE + 2, part.y * TILE_SIZE + 2, TILE_SIZE - 4, TILE_SIZE - 4);
        }
        ctx.shadowBlur = 0; // reset

        // Update & Draw Particles
        for(let i = particles.length - 1; i >= 0; i--) {
            let p = particles[i];
            p.x += p.vx;
            p.y += p.vy;
            p.life -= delta;
            
            if(p.life <= 0) {
                particles.splice(i, 1);
            } else {
                ctx.globalAlpha = p.life / p.maxLife;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
                ctx.fill();
            }
        }
        ctx.globalAlpha = 1.0;
    }

    function spawnParticles(x, y, color) {
        for(let i=0; i<15; i++) {
            particles.push({
                x: x, y: y,
                vx: (Math.random() - 0.5) * 8,
                vy: (Math.random() - 0.5) * 8,
                life: 500 + Math.random() * 300,
                maxLife: 800,
                size: Math.random() * 4 + 1,
                color: color
            });
        }
    }

    // --- CONTROLS (Swipe & Keyboard) ---
    document.addEventListener('keydown', (e) => {
        if (!isPlaying) return;
        if (e.key === 'ArrowUp' && dy === 0) { nextDx = 0; nextDy = -1; }
        else if (e.key === 'ArrowDown' && dy === 0) { nextDx = 0; nextDy = 1; }
        else if (e.key === 'ArrowLeft' && dx === 0) { nextDx = -1; nextDy = 0; }
        else if (e.key === 'ArrowRight' && dx === 0) { nextDx = 1; nextDy = 0; }
    });

    let touchStartX = 0;
    let touchStartY = 0;

    document.addEventListener('touchstart', (e) => {
        touchStartX = e.changedTouches[0].screenX;
        touchStartY = e.changedTouches[0].screenY;
    }, {passive: false});

    document.addEventListener('touchmove', (e) => {
        if(isPlaying) e.preventDefault(); // Stop scrolling on mobile while playing
    }, {passive: false});

    document.addEventListener('touchend', (e) => {
        if(!isPlaying) return;
        let touchEndX = e.changedTouches[0].screenX;
        let touchEndY = e.changedTouches[0].screenY;
        
        let diffX = touchEndX - touchStartX;
        let diffY = touchEndY - touchStartY;
        
        // Determine swipe direction based on largest delta
        if (Math.abs(diffX) > Math.abs(diffY)) {
            // Horizontal swipe
            if (Math.abs(diffX) > 30) { // Threshold
                if (diffX > 0 && dx === 0) { nextDx = 1; nextDy = 0; } // Right
                else if (diffX < 0 && dx === 0) { nextDx = -1; nextDy = 0; } // Left
            }
        } else {
            // Vertical swipe
            if (Math.abs(diffY) > 30) {
                if (diffY > 0 && dy === 0) { nextDx = 0; nextDy = 1; } // Down
                else if (diffY < 0 && dy === 0) { nextDx = 0; nextDy = -1; } // Up
            }
        }
    });

    // --- GAME OVER & META ---
    function gameOver() {
        isPlaying = false;
        
        // Juice: screen shake effect
        document.getElementById('canvas-wrapper').style.transform = 'translate(5px, 5px)';
        setTimeout(()=> document.getElementById('canvas-wrapper').style.transform = 'translate(-5px, -5px)', 50);
        setTimeout(()=> document.getElementById('canvas-wrapper').style.transform = 'translate(5px, -5px)', 100);
        setTimeout(()=> document.getElementById('canvas-wrapper').style.transform = 'translate(0, 0)', 150);

        document.getElementById('go-score').innerText = score;
        document.getElementById('go-coins').innerText = sessionCoins;
        
        let reviveBtn = document.getElementById('btn-revive');
        if(canRevive && snake.length > 3) {
            reviveBtn.style.display = 'block';
        } else {
            reviveBtn.style.display = 'none';
        }
        
        setTimeout(() => {
            document.getElementById('game-over').classList.add('active');
        }, 500);
    }

    function watchAdToRevive() {
        canRevive = false; // Only once per game
        document.getElementById('btn-revive').innerText = "Watching Ad...";
        
        setTimeout(() => {
            document.getElementById('game-over').classList.remove('active');
            
            // Revive logic: Cut tail in half to give space, reset direction safely
            let safeLength = Math.max(3, Math.floor(snake.length / 2));
            snake = snake.slice(0, safeLength);
            
            // Try to find a safe direction if head is at wall
            let head = snake[0];
            if(head.x <= 0) { nextDx = 1; nextDy = 0; }
            else if(head.x >= TILES_X-1) { nextDx = -1; nextDy = 0; }
            else if(head.y <= 0) { nextDx = 0; nextDy = 1; }
            else if(head.y >= TILES_Y-1) { nextDx = 0; nextDy = -1; }
            
            dx = nextDx; dy = nextDy;
            isPlaying = true;
            lastRender = performance.now();
            requestAnimationFrame(loop);
            
            document.getElementById('btn-revive').innerText = "Watch Ad to Revive (1x)";
        }, 1500);
    }

    function returnToMenu() {
        updateShopUI();
        document.getElementById('game-over').classList.remove('active');
        document.getElementById('main-menu').classList.add('active');
    }

    // --- SHOP LOGIC ---
    function updateHUD() {
        document.getElementById('val-score').innerText = score;
        document.getElementById('val-coins').innerText = state.coins;
    }

    function updateShopUI() {
        let lenCost = state.upgrades.lenLevel * 100;
        let multCost = state.upgrades.multLevel * 250;
        
        document.getElementById('lvl-len').innerText = `(Lvl ${state.upgrades.lenLevel})`;
        document.getElementById('lvl-mult').innerText = `(Lvl ${state.upgrades.multLevel})`;
        
        let btnLen = document.getElementById('btn-buy-len');
        btnLen.innerText = `${lenCost} 🪙`;
        if(state.coins >= lenCost) btnLen.classList.remove('disabled');
        else btnLen.classList.add('disabled');
        
        let btnMult = document.getElementById('btn-buy-mult');
        btnMult.innerText = `${multCost} 🪙`;
        if(state.coins >= multCost) btnMult.classList.remove('disabled');
        else btnMult.classList.add('disabled');
    }

    function buyUpgrade(type) {
        if(type === 'len') {
            let cost = state.upgrades.lenLevel * 100;
            if(state.coins >= cost) {
                state.coins -= cost;
                state.upgrades.lenLevel++;
            }
        } else if (type === 'mult') {
            let cost = state.upgrades.multLevel * 250;
            if(state.coins >= cost) {
                state.coins -= cost;
                state.upgrades.multLevel++;
            }
        }
        saveGame();
        updateShopUI();
        document.getElementById('val-coins').innerText = state.coins;
    }

    // Start
    loadSave();
</script>
  <script src="native-bridge.js"></script>
  <script src="neonsnake-adapter.js"></script>
</body>
</html>
